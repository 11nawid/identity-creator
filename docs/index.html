<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Creator</title>
  <meta name="description" content="Open-source synthetic identity generator for testing and development. Free, offline-first, privacy-focused.">
  <meta name="keywords" content="identity generator, synthetic data, fake profile, test data, open source, free tool">
  <meta property="og:title" content="Identity Creator — Synthetic Profile Generator">
  <meta property="og:description" content="Free, open-source synthetic identity generator. Works offline. No tracking.">
  <meta property="og:image" content="https://identity-creator-sigma.vercel.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Identity Creator">
  <meta name="twitter:description" content="Free, open-source synthetic identity generator. Works offline.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="canonical" href="https://11nawid.github.io/identity-creator/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      width: 48px;
      height: 48px;
      background: #ededed;
      color: #0a0a0a;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    p {
      color: #737373;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      max-width: 380px;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
    }

    a:hover { opacity: 0.85; transform: scale(0.98); }

    .btn-primary { background: #ededed; color: #0a0a0a; }
    .btn-secondary { background: #171717; color: #ededed; border: 1px solid #262626; }
    .btn-secondary:hover { border-color: #404040; }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #404040;
    }

    .footer a { color: #525252; padding: 0; border-radius: 0; font-size: 0.75rem; }
    .footer a:hover { color: #ededed; opacity: 1; transform: none; }

    @media (max-width: 420px) {
      h1 { font-size: 1.5rem; }
      .actions { flex-direction: column; align-items: center; }
      a { width: 200px; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="icon">&#x1F464;</div>
  <h1>Identity Creator</h1>
  <p>Generate realistic synthetic identities for testing, prototyping, and development.</p>
  <div class="actions">
    <a href="https://identity-creator-sigma.vercel.app" class="btn-primary">Try Now &rarr;</a>
    <a href="https://github.com/11nawid/identity-creator" class="btn-secondary">GitHub</a>
  </div>
  <div class="footer">
    <a href="https://identity-creator-sigma.vercel.app/privacy">Privacy</a>
    &nbsp;&middot;&nbsp;
    <a href="https://identity-creator-sigma.vercel.app/terms">Terms</a>
    &nbsp;&middot;&nbsp;
    <a href="https://github.com/11nawid/identity-creator">Source</a>
  </div>
</body>
</html>
